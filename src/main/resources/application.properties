# ---------- Server ----------
server.port=8080
# Staff stays logged in for 60 minutes of inactivity
server.servlet.session.timeout=60m

# ---------- Database ----------
# The user and password are created by schema.sql.
# For real use, set DB_USERNAME and DB_PASSWORD as environment variables instead.
spring.datasource.url=jdbc:mysql://localhost:3306/budget_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:budget_app}
spring.datasource.password=${DB_PASSWORD:budget123}

# schema.sql creates the tables, so JPA must not change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- Receipt uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads/receipts
