<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Department Budget System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-main">
        <div class="login-card">
            <div class="brand-mark">₹</div>
            <h1>Department Budget System</h1>
            <p class="muted small">Log in to manage the department budget.</p>

            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" autocomplete="username">
                <span class="error" id="username-error"></span>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password">
                <span class="error" id="password-error"></span>
            </div>
            <span class="error" id="form-error"></span>
            <button class="btn-primary" id="login-btn" onclick="login()">Log in</button>
        </div>
    </main>
    <footer class="footer">Department Budget Management System</footer>

    <script src="script.js"></script>
    <script>
        // Already logged in? Go straight to the dashboard
        if (sessionStorage.getItem('staff')) {
            window.location = 'dashboard.html';
        }

        async function login() {
            clearErrors();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            let ok = true;
            if (!username) { showError('username', 'Enter your username'); ok = false; }
            if (!password) { showError('password', 'Enter your password'); ok = false; }
            if (!ok) return;

            const button = document.getElementById('login-btn');
            button.disabled = true;
            try {
                const data = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username: username, password: password })
                });
                sessionStorage.setItem('staff', data.username);
                window.location = 'dashboard.html';
            } catch (err) {
                showError('form', err.message);
            } finally {
                button.disabled = false;
            }
        }

        // Pressing Enter in either box logs in
        ['username', 'password'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
